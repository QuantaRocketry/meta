[tools]
node = "lts"
pnpm = "latest"
pre-commit = "latest"
prettier = "latest"

[tasks.install]
description = "Install Node.js dependencies"
run = "pnpm install"

[tasks.build]
description = "Build the Tauri app"
run = "pnpm tauri build"

[tasks.dev]
description = "Run the Tauri app in development mode"
run = "pnpm tauri dev"

[tasks.test]
description = "Run the Rust tests for the Tauri backend"
dir = "{{config_root}}/src-tauri"
run = "cargo test"

[tasks.check]
description = "Type-check and build the frontend"
run = ["pnpm tsc", "pnpm vite build"]

[tasks.install-run]
description = "Install dependencies, build, then run in development mode"
depends = ["install", "build", "dev"]

[tasks."gen:types"]
description = "Regenerate src/generated/qcp from the qcp Rust types"
dir = "{{config_root}}"
run = [
  "rm -rf src/generated/qcp",
  "TS_RS_EXPORT_DIR={{config_root}}/src/generated/qcp cargo test -p qcp --features ts --manifest-path ../../Cargo.toml",
]
