[package]
name = "feather-rp2040-rfm95"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = { workspace = true }
embassy-rp = { workspace = true, features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
embassy-usb = { workspace = true }
embedded-hal = { workspace = true }
embedded-hal-bus = { workspace = true }
heapless = { workspace = true }
panic-halt = "1.0.0"
portable-atomic = { workspace = true, features = ["critical-section"] }
static_cell = { workspace = true }
sx1276 = { path = "../../../libs/sx1276" }
